<!-- BOOKING RECEIPT -->
<div id="page-body" class="receipt-body" style="min-height: 100vh; background-color: #F8F9FC; position: relative; overflow: hidden; padding: 40px 20px;">
    
    <!-- Subtle background decorative blobs -->
    <div class="bg-blob blob-blue" style="position: absolute; top: -100px; left: -100px; width: 300px; height: 300px; background: rgba(0, 74, 198, 0.05); border-radius: 50%; filter: blur(40px);"></div>
    <div class="bg-blob blob-green" style="position: absolute; bottom: -100px; right: -100px; width: 300px; height: 300px; background: rgba(22, 101, 52, 0.05); border-radius: 50%; filter: blur(40px);"></div>

    <main class="receipt-layout" style="position: relative; z-index: 10; display: flex; justify-content: center; align-items: center;">
        
        <div class="receipt-container" style="width: 100%; max-width: 440px;">
            
            <!-- MAIN RECEIPT CARD -->
            <div class="receipt-card" style="background: white; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(19, 27, 46, 0.08);">
                
                <!-- 1. Header -->
                <a href="#" onclick="navigateTo('dashboard'); return false;" class="brand-logo-group" style="text-decoration: none; display: flex; align-items: center;">
    <img src="images/logo.jpeg" alt="SAMHAL" class="brand-logo-img">
</a>

                <!-- 2. Success Section -->
                <div class="receipt-success-section" style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px;">
                    <div class="receipt-success-icon" style="width: 56px; height: 56px; background: #166534; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <h1 class="receipt-title" style="font-size: 22px; font-weight: 700; color: #131B2E; margin: 0 0 8px 0;">Payment Successful</h1>
                    <span class="receipt-txn-label" style="font-size: 12px; color: #737686; text-transform: uppercase; letter-spacing: 0.5px;">Transaction ID</span>
                    <span id="receipt-txn-id" class="receipt-txn-value" style="font-size: 14px; font-weight: 600; color: #505F76;">TXN-984A-772B-10C</span>
                </div>

                <!-- 3. Divider -->
                <div class="receipt-dashed-divider" style="height: 1px; border-bottom: 2px dashed #E2E4EB; margin: 24px 0;"></div>

                <!-- 4. Service Details -->
                <div class="receipt-section" style="margin-bottom: 24px;">
                    <h2 class="receipt-section-label" style="font-size: 14px; color: #737686; font-weight: 600; margin: 0 0 16px 0;">Service Details</h2>
                    
                    <div class="receipt-service-info" style="display: flex; gap: 16px; margin-bottom: 16px;">
                        <div class="receipt-icon-box" style="width: 48px; height: 48px; background: #F8F9FC; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #004AC6; flex-shrink: 0;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        </div>
                        <div class="receipt-service-text">
                            <h3 id="receipt-service-name" class="receipt-service-name" style="font-size: 16px; font-weight: 600; color: #131B2E; margin: 0 0 4px 0;">AC Repair Service</h3>
                            <p id="receipt-service-desc" class="receipt-service-desc" style="font-size: 13px; color: #505F76; margin: 0; line-height: 1.4;">Butwal, Nepal</p>
                        </div>
                    </div>
                    
                    <div class="receipt-date-row" style="display: flex; align-items: center; gap: 8px; color: #505F76; font-size: 14px; font-weight: 500; background: #F8F9FC; padding: 12px; border-radius: 8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        <span id="receipt-date">Aug 12, 2026 at 11:30 AM</span>
                    </div>
                </div>

                <!-- 5. Service Partner -->
                <div class="receipt-section" style="margin-bottom: 24px;">
                    <h2 class="receipt-section-label" style="font-size: 14px; color: #737686; font-weight: 600; margin: 0 0 16px 0;">Service Partner</h2>
                    
                    <div class="receipt-partner-card" style="display: flex; justify-content: space-between; align-items: center; border: 1px solid #E2E4EB; padding: 12px; border-radius: 8px;">
                        <div class="rpc-left" style="display: flex; align-items: center; gap: 12px;">
                            <img id="receipt-avatar" src="https://picsum.photos/100" alt="Partner" class="rpc-avatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                            <div class="rpc-info" style="display: flex; flex-direction: column;">
                                <span id="receipt-company" class="rpc-company" style="font-size: 14px; font-weight: 600; color: #131B2E;">Suman Technical</span>
                                <span class="rpc-name" style="font-size: 12px; color: #505F76;">Verified Professional</span>
                            </div>
                        </div>
                        <button class="rpc-phone-btn" aria-label="Call Partner" style="width: 36px; height: 36px; border-radius: 50%; background: #E2E7FF; color: #004AC6; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- 6. Divider -->
                <div class="receipt-dashed-divider" style="height: 1px; border-bottom: 2px dashed #E2E4EB; margin: 24px 0;"></div>

                <!-- 7. Payment Breakdown -->
                <div class="receipt-section">
                    <h2 class="receipt-section-label" style="font-size: 14px; color: #737686; font-weight: 600; margin: 0 0 16px 0;">Payment Breakdown</h2>
                    
                    <div class="receipt-payment-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
                        <div class="receipt-payment-row" style="display: flex; justify-content: space-between; font-size: 14px;">
                            <span class="rpr-label" style="color: #505F76;">Base Service Fee</span>
                            <span id="receipt-base-fee" class="rpr-value" style="color: #131B2E; font-weight: 500;">Rs. 1,000</span>
                        </div>
                        <div class="receipt-payment-row" style="display: flex; justify-content: space-between; font-size: 14px;">
                            <span class="rpr-label" style="color: #505F76;">Platform Fee</span>
                            <span class="rpr-value" style="color: #131B2E; font-weight: 500;">Rs. 50</span>
                        </div>
                    </div>
                    
                    <div class="receipt-solid-divider" style="height: 1px; background: #E2E4EB; margin: 16px 0;"></div>
                    
                    <div class="receipt-total-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <span class="rtr-label" style="font-size: 16px; font-weight: 600; color: #131B2E;">Total Amount</span>
                        <span id="receipt-total" class="rtr-value" style="font-size: 20px; font-weight: 800; color: #004AC6;">Rs. 1,050</span>
                    </div>

                    <div class="receipt-wallet-pill" style="display: inline-flex; align-items: center; gap: 8px; background: #F8F9FC; border: 1px solid #E2E4EB; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #131B2E;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#505F76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                        <span id="receipt-wallet-text">Paid via eSewa</span>
                    </div>
                </div>

            </div>

            <!-- 8. Buttons (Outside the card) -->
            <div class="receipt-actions" style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
                <button onclick="handleFinishBooking()" class="receipt-btn btn-primary" style="width: 100%; padding: 16px; border-radius: 8px; border: none; background: #004AC6; color: white; font-weight: 600; font-size: 16px; cursor: pointer;">Go to Dashboard</button>
                <button onclick="showPopup('Receipt PDF downloaded successfully!', 'success')" class="receipt-btn btn-outline" style="width: 100%; padding: 16px; border-radius: 8px; border: 1px solid #C3C6D7; background: transparent; color: #131B2E; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    Download PDF
                </button>
            </div>

        </div>

    </main>
</div>
