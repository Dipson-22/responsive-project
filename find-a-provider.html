<div id="page-body" style="display: flex; flex-direction: column; width: 100%; height: 100%;">
    
    <main class="fap-main fap-container" style="display: flex; gap: 24px; flex: 1; padding-top: 32px; padding-bottom: 40px; height: calc(100vh - 80px);">
        
        <!-- SECTION 2: LEFT SIDEBAR -->
        <aside class="fap-sidebar" style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; overflow-y: auto; padding-right: 12px; height: 100%;">
            
            <div class="fap-sidebar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 id="fap-count" style="color: #131B2E; font-size: 18px; font-weight: 700; margin: 0;">0 Providers found</h2>
                <div class="fap-filters-btn" id="fap-filters-toggle-btn" onclick="toggleCategoryFilters()" style="display: flex; align-items: center; gap: 6px; color: #505F76; font-size: 14px; cursor: pointer; user-select: none;">
                    <span>Filters</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" x2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>
                </div>
            </div>

            <!-- Original Quick Filter Chips Layout -->
            <div class="fap-chips" id="fap-filter-chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;">
                <div class="fap-chip" data-filter="top-rated" style="cursor: pointer; user-select: none;">Top Rated</div>
                <div class="fap-chip" data-filter="available-now" style="cursor: pointer; user-select: none;">Available Now</div>
                <div class="fap-chip" data-filter="under-1000" style="cursor: pointer; user-select: none;">Under Rs. 1000</div>
            </div>

            <!-- Expandable 8-Category Filter Box (toggled by Filters button) -->
            <div id="fap-categories-panel" style="display: none; background: #FFFFFF; border: 1px solid rgba(195, 198, 215, 0.6); border-radius: 12px; padding: 14px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(19, 27, 46, 0.04);">
                <div style="font-size: 13px; font-weight: 700; color: #131B2E; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span>Filter by Category</span>
                    <span onclick="clearCategoryFilter()" style="font-size: 12px; color: #004AC6; cursor: pointer; font-weight: 600;">Reset</span>
                </div>
                <div class="fap-chips" id="fap-category-chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0;">
                    <!-- Categories injected dynamically by script.js -->
                </div>
            </div>

            <div class="fap-provider-list" id="dynamic-provider-list" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- JS will inject the cards here -->
            </div>
        </aside>

        <!-- SECTION 3: RIGHT SECTION (Map) -->
        <section class="fap-map-container" style="flex: 1; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); position: relative; min-height: 500px;">
            <div id="map" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;"></div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-left">
                <a href="#" onclick="navigateTo('home'); return false;" class="logo brand-logo-group">
                    <img src="images/logo.jpeg" alt="SAMHAL" class="brand-logo-img">
                </a>
                <p class="tagline">Your trusted platform for local, reliable service professionals.</p>
                <p class="copyright">&copy; 2026 SAMHAL Services Nepal. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <ul class="footer-links">
                    <li><a href="#" onclick="return false;">About Us</a></li>
                    <li><a href="#" onclick="return false;">Contact Support</a></li>
                    <li><a href="#" onclick="return false;">Privacy Policy</a></li>
                    <li><a href="#" onclick="return false;">Terms of Service</a></li>
                </ul>
            </div>
        </div>
    </footer>
</div>
